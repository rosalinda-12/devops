<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Práctica de Virtualización - WSL2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #2c3e50, #4ca1af);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 40px 50px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .logo { font-size: 60px; margin-bottom: 10px; }
    h1 { font-size: 26px; margin-bottom: 15px; }
    p { font-size: 16px; line-height: 1.6; opacity: 0.9; }
    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 20px;
      background: #2c3e50;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">&#128039;</div>
    <h1>Servidor corriendo en una VM real</h1>
    <p>Esta página se sirve desde Nginx instalado directamente
       sobre Debian, dentro de una máquina virtual WSL2 con su propio kernel Linux.</p>
    <div class="badge">¡Actualizado por el pipeline! &#10004;</div>
  </div>
</body>
</html>
